plugins {
    id 'java'
    id 'java-gradle-plugin'
    id 'maven-publish'
    id 'com.jfrog.artifactory'
    id 'com.gradle.plugin-publish'
    id 'org.sonarqube'
}

description "Gradle plugin to convert JaCoCo coverage reports to Cobertura coverage reports"

def projectName = 'Gradle Jacotura plugin'
def githubUrl = 'https://github.com/chirag-ji/Jacotura'

java {
    sourceCompatibility = rootProject.ext.javaVersion
    targetCompatibility = rootProject.ext.javaVersion
    withSourcesJar()
}

dependencies {
    implementation(project(":jacotura-core"))
    compileOnly(gradleApi())

    annotationProcessor("org.projectlombok:lombok:${rootProject.ext.lombokVersion}")
    compileOnly("org.projectlombok:lombok:${rootProject.ext.lombokVersion}")

    testCompileOnly("org.projectlombok:lombok:${rootProject.ext.lombokVersion}")
    testAnnotationProcessor("org.projectlombok:lombok:${rootProject.ext.lombokVersion}")

    testImplementation("org.mockito:mockito-all:${rootProject.ext.mockitoVersion}")
    testImplementation("org.junit.jupiter:junit-jupiter-api:${rootProject.ext.jUnitVersion}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${rootProject.ext.jUnitVersion}")
}

test {
    useJUnitPlatform()
}

pluginBundle {
    website = githubUrl
    vcsUrl = githubUrl
    description = project.description
    tags = ['cobertura', 'jacoco', 'jacotura', 'reports']

    mavenCoordinates {
        groupId = project.group
        artifactId = "jacotura-gradle-plugin"
    }
}

gradlePlugin {
    plugins {
        jacoturaPlugin {
            displayName = projectName
            description = project.description
            id = 'io.github.chiragji.jacotura'
            implementationClass = 'io.github.chiragji.jacotura.JacoturaPlugin'
        }
    }
}

test {
    useJUnitPlatform()
}

artifactory {
    contextUrl = artifactory_contextUrl

    publish {
        contextUrl = artifactory_contextUrl

        repository {
            repoKey = artifactory_repoKey
            username = artifactory_user
            password = artifactory_password
        }

        defaults {
            publications("mavenJava")
            publishConfigs('published')
            publishIvy = false
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from(components.java)
        }
    }
}

sonarqube {
    properties {
        property "sonar.projectKey", "chirag-ji_Jacotura"
        property "sonar.organization", "chirag-ji"
        property "sonar.host.url", "https://sonarcloud.io"
    }
}
